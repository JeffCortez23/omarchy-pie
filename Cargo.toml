[package]
name = "omarchy-pie"
version = "0.1.0"
edition = "2021"
description = "Contextual radial pie menu & Swiss-army file tool for Omarchy (Hyprland + Quickshell)"
authors = ["elyefris"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico"] }
base64 = "0.22"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
percent-encoding = "2.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
